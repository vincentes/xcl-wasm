[workspace]
resolver = "2"
members = ["crates/xcl", "crates/xcl-emu", "crates/xcl-guest", "crates/xcl-web", "tests/testtitle", "tests/testgamedll"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

# the interpreter is the inner loop of every guest test: optimised in development builds too
[profile.dev.package.xcl-emu]
opt-level = 3
